name: Publish Moonotes v0.6.3-alpha.7 prerelease

# This workflow only publishes a prerelease after the dedicated release notes
# file is added to the feature branch. It never replaces the latest stable release.
on:
  push:
    branches:
      - feature/0.6.3-bttv-modifiers
    paths:
      - docs/releases/v0.6.3-alpha.7.md

permissions:
  contents: write

concurrency:
  group: moonotes-v0.6.3-alpha.7-publish
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.repository == 'mymoonx/moonotes'
    name: Build, verify and publish alpha.7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            moonotes/*.gradle
            moonotes/gradle.properties
            moonotes/gradle/wrapper/gradle-wrapper.properties
            network/*.gradle
            network/gradle.properties
            network/gradle/wrapper/gradle-wrapper.properties

      - name: Build Moonotes Core 0.4.3
        working-directory: moonotes
        run: bash ./gradlew --no-daemon clean build

      - name: Build Moonotes Network 0.6.3-alpha.7 with regression checks
        working-directory: network
        run: bash ./gradlew --no-daemon clean build

      - name: Verify exact versions and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s moonotes/build/libs/moonotes-0.4.3.jar
          test -s network/build/libs/moonotes-network-0.6.3-alpha.7.jar
          unzip -p moonotes/build/libs/moonotes-0.4.3.jar fabric.mod.json | grep -F '"id": "moonotes"'
          unzip -p moonotes/build/libs/moonotes-0.4.3.jar fabric.mod.json | grep -F '"version": "0.4.3"'
          unzip -p network/build/libs/moonotes-network-0.6.3-alpha.7.jar fabric.mod.json | grep -F '"id": "moonotes_network"'
          unzip -p network/build/libs/moonotes-network-0.6.3-alpha.7.jar fabric.mod.json | grep -F '"version": "0.6.3-alpha.7"'
          sha256sum moonotes/build/libs/moonotes-0.4.3.jar \
                    network/build/libs/moonotes-network-0.6.3-alpha.7.jar > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Set up Node.js 24 for Worker tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Run Worker tests without deployment
        working-directory: worker
        run: npm ci && npm test

      - name: Publish verified public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.6.3-alpha.7 >/dev/null 2>&1; then
            echo 'Existing prerelease preserved; no assets or tag overwritten'
            exit 0
          fi
          gh release create v0.6.3-alpha.7 \
            moonotes/build/libs/moonotes-0.4.3.jar \
            network/build/libs/moonotes-network-0.6.3-alpha.7.jar \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title 'Moonotes 0.6.3-alpha.7 — эффекты BTTV и Paper-чат' \
            --notes-file docs/releases/v0.6.3-alpha.7.md
