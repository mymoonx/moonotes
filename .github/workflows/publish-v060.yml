name: Publish Moonotes v0.6.0 stable release

# The stable release is published only when the dedicated notes file reaches main.
# Branch previews and PRs cannot publish assets; a rerun cannot overwrite a release JAR.
on:
  push:
    branches:
      - main
    paths:
      - docs/releases/v0.6.0.md

permissions:
  contents: write

concurrency:
  group: moonotes-v0.6.0-publish
  cancel-in-progress: false

jobs:
  stable:
    if: github.repository == 'mymoonx/moonotes'
    name: Build, verify and publish 0.6.0
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out merged release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            moonotes/*.gradle
            moonotes/gradle.properties
            moonotes/gradle/wrapper/gradle-wrapper.properties
            network/*.gradle
            network/gradle.properties
            network/gradle/wrapper/gradle-wrapper.properties

      - name: Build Moonotes 0.4.1
        working-directory: moonotes
        run: bash ./gradlew --no-daemon clean build

      - name: Build and test Moonotes Network 0.6.0
        working-directory: network
        run: bash ./gradlew --no-daemon clean build

      - name: Check JAR identity, exact version and create checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s moonotes/build/libs/moonotes-0.4.1.jar
          test -s network/build/libs/moonotes-network-0.6.0.jar
          unzip -p network/build/libs/moonotes-network-0.6.0.jar fabric.mod.json | grep -F '"id": "moonotes_network"'
          unzip -p network/build/libs/moonotes-network-0.6.0.jar fabric.mod.json | grep -F '"version": "0.6.0"'
          sha256sum moonotes/build/libs/moonotes-0.4.1.jar \
                    network/build/libs/moonotes-network-0.6.0.jar > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Set up Node.js 24 for Worker checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Run Worker tests (no Cloudflare deployment)
        working-directory: worker
        run: npm ci && npm test

      - name: Create GitHub Release with verified JAR files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release edit v0.6.0 --notes-file docs/releases/v0.6.0.md
            echo "Existing 0.6.0 assets and tag preserved"
            exit 0
          fi
          gh release create v0.6.0 \
            moonotes/build/libs/moonotes-0.4.1.jar \
            network/build/libs/moonotes-network-0.6.0.jar \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Moonotes 0.6.0 — стабильный релиз" \
            --notes-file docs/releases/v0.6.0.md
