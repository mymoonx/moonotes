name: Publish Moonotes v0.6.0-alpha.4 prerelease

# Single opt-in publishing commit on the author's development branch.
# This workflow cannot publish on forks, PRs, or subsequent source-only pushes.
on:
  push:
    branches:
      - feature/emote-wheel-world-reactions
    paths:
      - docs/releases/v0.6.0-alpha.4.md

permissions:
  contents: write

concurrency:
  group: moonotes-v0.6.0-alpha.4-publish
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build, verify and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            moonotes/*.gradle
            moonotes/gradle/wrapper/gradle-wrapper.properties
            network/*.gradle
            network/gradle/wrapper/gradle-wrapper.properties

      - name: Build original Moonotes
        working-directory: moonotes
        run: bash ./gradlew --no-daemon clean build

      - name: Build Moonotes Network and run checks
        working-directory: network
        run: bash ./gradlew --no-daemon clean build

      - name: Verify expected installable JARs
        shell: bash
        run: |
          set -euo pipefail
          test -s moonotes/build/libs/moonotes-0.4.1.jar
          test -s network/build/libs/moonotes-network-0.6.0-alpha.4.jar
          unzip -p network/build/libs/moonotes-network-0.6.0-alpha.4.jar fabric.mod.json | grep -F '"version": "0.6.0-alpha.4"'
          sha256sum moonotes/build/libs/moonotes-0.4.1.jar \
                    network/build/libs/moonotes-network-0.6.0-alpha.4.jar > SHA256SUMS.txt

      - name: Publish GitHub prerelease and attach both JAR files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.6.0-alpha.4 >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to replace any published assets"
            exit 1
          fi
          gh release create v0.6.0-alpha.4 \
            moonotes/build/libs/moonotes-0.4.1.jar \
            network/build/libs/moonotes-network-0.6.0-alpha.4.jar \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Moonotes 0.6.0-alpha.4 — колесо, реакции, книги и таблички" \
            --notes-file docs/releases/v0.6.0-alpha.4.md
