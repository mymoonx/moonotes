name: Moonotes beta.4 independent smoke build

# Branch-only QA, independent of the queued pull-request build.
on:
  push:
    branches:
      - feature/0.6.2-reactions-beta1
    paths:
      - .github/workflows/beta4-smoke.yml
      - 'network/**'
      - 'moonotes/**'

permissions:
  contents: read

jobs:
  beta4:
    name: Beta4 JARs / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            moonotes/*.gradle
            moonotes/gradle/wrapper/gradle-wrapper.properties
            network/*.gradle
            network/gradle/wrapper/gradle-wrapper.properties

      - name: Build core Moonotes on Linux
        if: runner.os != 'Windows'
        working-directory: moonotes
        shell: bash
        run: bash ./gradlew --no-daemon clean build

      - name: Build core Moonotes on Windows
        if: runner.os == 'Windows'
        working-directory: moonotes
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build

      - name: Build Network and regression tests on Linux
        if: runner.os != 'Windows'
        working-directory: network
        shell: bash
        run: bash ./gradlew --no-daemon clean build

      - name: Build Network and regression tests on Windows
        if: runner.os == 'Windows'
        working-directory: network
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build

      - name: Verify Linux JARs and Network version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -s moonotes/build/libs/moonotes-0.4.2.jar
          test -s network/build/libs/moonotes-network-0.6.2-beta.4.jar
          unzip -p network/build/libs/moonotes-network-0.6.2-beta.4.jar fabric.mod.json |
            grep -F '"version": "0.6.2-beta.4"'

      - name: Verify Windows JARs and file size
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("moonotes/build/libs/moonotes-0.4.2.jar",
              "network/build/libs/moonotes-network-0.6.2-beta.4.jar")) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -le 0) {
              throw "Missing or empty installable JAR: $file"
            }
          }

      - name: Upload beta.4 installable JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moonotes-beta4-${{ runner.os }}-${{ github.sha }}
          path: |
            moonotes/build/libs/moonotes-0.4.2.jar
            network/build/libs/moonotes-network-0.6.2-beta.4.jar
          if-no-files-found: error
          retention-days: 14
