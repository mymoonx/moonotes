name: Moonotes beta.3 independent smoke build

# One-shot branch QA, independent of the queued pull-request build.
on:
  push:
    branches:
      - feature/0.6.2-reactions-beta1
    paths:
      - .github/workflows/beta3-smoke.yml

permissions:
  contents: read

jobs:
  beta3:
    name: Beta3 JARs / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            moonotes/*.gradle
            moonotes/gradle/wrapper/gradle-wrapper.properties
            network/*.gradle
            network/gradle/wrapper/gradle-wrapper.properties

      - name: Build core Moonotes
        working-directory: moonotes
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe /c gradlew.bat --no-daemon clean build
          else
            bash ./gradlew --no-daemon clean build
          fi

      - name: Build Network and run all regression checks
        working-directory: network
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe /c gradlew.bat --no-daemon clean build
          else
            bash ./gradlew --no-daemon clean build
          fi

      - name: Verify the expected installable JAR names
        shell: bash
        run: |
          test -s moonotes/build/libs/moonotes-0.4.2.jar
          test -s network/build/libs/moonotes-network-0.6.2-beta.3.jar
          unzip -p network/build/libs/moonotes-network-0.6.2-beta.3.jar fabric.mod.json | grep -F '"version": "0.6.2-beta.3"'

      - name: Upload beta.3 installable files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moonotes-beta3-${{ runner.os }}-${{ github.sha }}
          path: |
            moonotes/build/libs/moonotes-0.4.2.jar
            network/build/libs/moonotes-network-0.6.2-beta.3.jar
          if-no-files-found: error
          retention-days: 14
